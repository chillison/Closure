# 设定页（task 08-30-asset-cards-visualization A3 i18n 全词表）。
# 文案中文化纪律（prd R7/AC7，mirror 世界面板先例）：zh 界面零英文术语露出；
# 键名（代码标识符，= schema 字段原样）不受限。
# 词表唯一权威源 = packages/shared-contracts/src/contracts/creative-fields.ts：
#   - type 8 类（assetCardTypeSchema）/ status 4 值（assetCardStatusSchema）
#   - 组键 = 8 个 *FieldsSchema 顶层键去重 + 4 公共 sub-schema
#     （narrative/writingCheatSheet/secrets/worldAndCanon）+ base 编辑组
#   - 字段键 = settingPage.field.<type>.<点路径换短横>（common = 4 公共组共享字段；
#     base = 卡面基础字段；name/id 在卡头不走组内字段键）
# 注意两个 locked：status.locked = 卡状态「锁定」；locked.* = asset_cards 整字段锁（只读横幅）。
settingPage:
  title: "设定"
  # ── 左列双 tab ──
  tab:
    cards: "设定卡"
    docs: "设定文档"
  # ── 工具栏 ──
  toolbar:
    newCard: "新建"
    searchPlaceholder: "搜索卡名、摘要、标签…"
  # ── 类型过滤 chips ──
  filter:
    all: "全部"
    noMatch: "没有匹配的卡"
  # ── 8 类卡名 + 未知 type 防御组（assetCardTypeSchema）──
  type:
    character: "人物"
    location: "地点"
    prop: "道具"
    organization: "组织"
    rule: "规则"
    visual_motif: "视觉母题"
    lore: "传说"
    golden_finger: "金手指"
    other: "其他"
  # ── 卡状态（assetCardStatusSchema；locked 此处 = 卡状态，非字段级锁）──
  status:
    draft: "草稿"
    active: "生效"
    deprecated: "废弃"
    locked: "锁定"
  # ── tier 三态（未标 → resolveTier 结构默认 + 「默认」角标）──
  tier:
    core: "核心"
    micro: "次要"
    unset: "未标"
    defaultBadge: "默认"
  # ── 零卡空态（双 CTA）──
  empty:
    title: "还没有任何设定卡"
    ctaAi: "找 AI 建"
    ctaManual: "手动新建"
  # ── 未选卡右列提示（B 波选中语义：null = 空态）──
  selectHint: "在左侧选择一张卡查看与编辑"
  # ── 卡头控件 aria 标签（name/id 不走组内字段键）──
  head:
    name: "名称"
    status: "状态"
    tier: "层级"
  # ── 未知 type 卡（归「其他」组，只读 JSON 视图）──
  other:
    readonlyHint: "未知类型的卡（只读）"
  # ── 设定文档区块（settings/*.md 列表入口；tab 显隐/死态/空态语义见 SettingPage）──
  docs:
    loading: "加载中…"
    empty: "该目录下还没有设定文档"
    openFailed: "打开文档失败：{name}"
  # ── CRUD / 编辑反馈（B 波消费）──
  action:
    delete: "删除这张卡"
    deleteConfirm: "确认删除「{name}」？此操作不可撤销。"
    create: "新建{type}卡"
    untitled: "未命名"
  # ── 表单补充文案（B 波：chips 添加占位 / kv 加行 / 行与删除钮 aria——AC7 中文化）──
  addChip: "＋ 添加"
  kvAddRow: "＋ 添加字段"
  kvKeyAria: "键 {index}"
  kvValueAria: "值 {index}"
  kvDeleteAria: "删除第 {index} 行"
  kvDuplicateKey: "与上方行键重复（生效的是首行）"
  chipRemoveAria: "删除 {item}"
  # ── 字段级锁（field_metadata.asset_cards.locked，整编辑面只读，非卡状态）──
  locked:
    banner: "设定卡已被锁定（只读），解锁后恢复编辑"
    unlock: "解锁"
  # 对象数组等暂不可表单化字段的占位说明
  fieldUnsupported: "暂不支持表单编辑"
  # ── 卡内关系只读占位（CR P7：KR-010 双源后置，不做编辑；含「图形化视图后置」语义）──
  relationships:
