researchSettings:
  pageSubtitle: "Research network, search-engine chain, document-parser endpoint, vision model, and wiki sites. Saves take effect immediately (no restart)."
  loading: "Loading research config…"
  loadFailed: "Failed to load the research config — reopen the settings page and retry."
  save: "Save"
  saving: "Saving…"
  saved: "Research config saved"
  saveFailed: "Save failed: {reason}"
  # ── Search section ──
  searchTitle: "Web search"
  searchSubtitle: "Zero-config out of the box (Bing → Baidu → DuckDuckGo auto-fallback); configured upgrade-layer engines jump the queue."
  engineOrder: "Engine chain order"
  engineOrderHint: "Engine ids in priority order, comma-separated. Available: searxng-local, searxng, bing, baidu, ddg, tavily, bocha, anysearch."
  engineOrderDefaultChain: "Default chain: local SearXNG (when the probe hits) → bing → baidu → ddg (overseas fallback). Key-gated engines (tavily/bocha) only activate with their key set."
  engineOrderRestore: "Restore default"
  localhostProbe: "Probe local SearXNG at startup (127.0.0.1:8888)"
  localhostProbeHint: "A hit injects the aggregator at chain head; a miss is silently skipped."
  searxngUrls: "SearXNG instance URLs"
  searxngUrlsHint: "One URL per line (the instance must enable the json output format). Self-host to use; SearXNG is not bundled."
  tavilyKey: "Tavily API key"
  bochaKey: "Bocha API key"
  anysearchKey: "AnySearch API key"
  keyPlaceholder: "Enter API key…"
  keyConfigured: "Configured (leave blank to keep)"
  keyHint: "Keys are stored encrypted via the OS keyring and never echoed back. Saving with a blank field keeps the existing key."
  keyClear: "Clear"
  keyClearUndo: "Undo clear"
  keyClearHint: "Mark for deletion; saving removes the stored key"
  keyClearPending: "Marked for clear (applies on save)"
  anysearchCloudNote: "AnySearch is a third-party cloud service (anonymous free tier; a key raises the quota) — queries leave your machine to that service."
  # ── Proxy section ──
  proxyTitle: "Research network proxy"
  proxySubtitle: "Every research outbound (search / wiki / fetch / parser endpoints) goes through this proxy setting."
  proxyMode: "Proxy mode"
  proxy_system: "Follow system (default)"
  proxy_custom: "Custom"
  proxy_off: "Direct (proxy off)"
  proxyUrlLabel: "Proxy URL"
  proxyBypassLabel: "Extra bypass hosts (optional)"
  proxyAuthNote: "Known limitation: authenticated proxies are not supported (Electron #21269). Workaround = run a local auth-free proxy at the system level. localhost always bypasses the proxy."
  # ── Doc parser section ──
  docTitle: "Document parsing"
  docSubtitle: "Configure an external parser endpoint (MinerU / docling-serve / custom thin protocol); unconfigured uses the builtin (PDF text layer / DOCX / plain text)."
  docType: "Endpoint type"
  docTypeNone: "Unconfigured (builtin parsing)"
  docTypeMineru: "MinerU (mineru-api)"
  docTypeDocling: "docling-serve"
  docTypeCustom: "Custom (thin protocol)"
  docBaseUrlLabel: "Endpoint URL"
  docTest: "Test connection"
  docTesting: "Testing…"
  docProbeOk: "Endpoint reachable"
  docProbeFail: "Endpoint unreachable"
  docProbeFailWith: "Endpoint unreachable: {reason}"
  docProbeUnavailable: "Probe call failed"
  docProbeNeedsSaveHint: "Pick an endpoint type, fill the URL, save, then test."
  docMineruNote: "MinerU ≥3.1 recommended (custom license; ≤3.0.x is AGPL). Self-hosted use is fine — this app only makes HTTP calls and never distributes its code."
  # ── Vision section ──
  visionTitle: "Vision model"
  visionSubtitle: "Once designated, the AI can read images directly (illustration review / rendered pages / scanned-document OCR)."
  visionModel: "Designation"
  visionNone: "Unconfigured (manual mode)"
  visionHint: "Add and enable a vision-capable model under “Models” first."
  visionTest: "Test vision probe"
  visionTesting: "Testing…"
  visionProbeOk: "Probe passed — the model read “{answer}” correctly"
  visionProbeAutoOk: "Vision canary passed: the model read “{answer}” from the image — it can see."
  visionProbeNote: "The probe sends a small image with an embedded character and checks the answer — it detects middlemen that silently strip images (stripping = hallucination risk). It also runs automatically whenever the designation changes."
  visionProbeUnavailable: "Probe call failed"
  visionManualNote: "Without a vision model the main text model is never blind-tried (silent stripping = hallucination) — images are exported to a file and copied to the clipboard with a prompt; forward them to a third-party vision app, then paste the answer back into the conversation to continue."
  # ── Wiki section ──
  wikiTitle: "Wiki sites"
  wikiSubtitle: "The MediaWiki site registry the research tools query (Moegirl / PRTS / bwiki / Fandom speak the same protocol)."
  wikiPresetsTitle: "Preset sites (read-only)"
  wikiCustomTitle: "Custom sites"
  wikiEmpty: "No custom sites yet. Add PRTS, bwiki, Fandom, or any MediaWiki site."
  wikiId: "Site id"
  wikiName: "Name"
  wikiUrl: "API URL"
  wikiSearchKind: "Search type"
  wikiKind_opensearch: "Title prefix"
  wikiKind_fulltext: "Full text"
  wikiAdd: "Add site"
  wikiDelete: "Remove site"
  wikiHint: "Search type: official sites often allow title-prefix search only; mirrors and self-hosted instances usually support full text. Ids colliding with presets are ignored."
  # ── Validation toasts ──
  validationProxyUrl: "A custom proxy requires the proxy URL"
  validationDocBaseUrl: "A parser endpoint type requires the endpoint URL"
  validationWikiRow: "A custom-site row is incomplete (id / name / URL are all required) — complete or clear it before saving"
