# Setting page (task 08-30-asset-cards-visualization, wave A3 i18n vocabulary).
# Key tree MUST stay exactly equal to zh-CN/settingPage.yaml (guarded by
# test/settingPageI18n.test.ts). Sole authority for type/status enums, group keys
# and field paths = packages/shared-contracts/src/contracts/creative-fields.ts.
# Field keys = settingPage.field.<type>.<dotted path with dots as hyphens>
# (common = the 4 shared sub-schemas; base = card-level edit fields).
# Two different "locked" notions: status.locked = card status; locked.* = the
# asset_cards field-level lock banner.
settingPage:
  # CR P4 (ruling 2): EN naming aligned with nav ("Codex") — one concept, one name.
  title: "Codex"
  # Left column dual tabs
  tab:
    cards: "Cards"
    docs: "Docs"
  # Toolbar
  toolbar:
    newCard: "New card"
    searchPlaceholder: "Search cards…"
  # Type filter chips
  filter:
    all: "All"
    noMatch: "No matching cards"
  # 8 card types + unknown-type fallback group (assetCardTypeSchema)
  type:
    character: "Character"
    location: "Location"
    prop: "Prop"
    organization: "Organization"
    rule: "Rule"
    visual_motif: "Visual motif"
    lore: "Lore"
    golden_finger: "Golden finger"
    other: "Other"
  # Card status (assetCardStatusSchema; locked here = card status, not field lock)
  status:
    draft: "Draft"
    active: "Active"
    deprecated: "Deprecated"
    locked: "Locked"
  # Tier three states (unset -> resolveTier structural default + "default" badge)
  tier:
    core: "Core"
    micro: "Micro"
    unset: "Unset"
    defaultBadge: "default"
  # Zero-card empty state (dual CTA)
  empty:
    title: "No setting cards yet"
    ctaAi: "Ask the agent"
    ctaManual: "Create manually"
  # Right-column hint when no card is selected (B-wave semantics: null = empty)
  selectHint: "Select a card on the left to view and edit"
  # Card-header control aria labels (name/id don't use field keys)
  head:
    name: "Name"
    status: "Status"
    tier: "Tier"
  # Unknown-type cards (grouped under "Other", read-only JSON view)
  other:
    readonlyHint: "Unknown card type (read-only)"
  # Setting docs section (settings/*.md list entry; tab visibility/dead-state/empty
  # semantics resolved in SettingPage)
  docs:
    loading: "Loading…"
    empty: "No setting docs in this folder yet"
    openFailed: "Failed to open {name}"
  # CRUD / edit feedback (B wave)
  action:
    delete: "Delete this card"
    deleteConfirm: "Delete \"{name}\"? This cannot be undone."
    create: "New {type} card"
    untitled: "Untitled"
  # Form auxiliary strings (B wave: chips add placeholder / kv add row / row & remove aria)
  addChip: "+ Add"
  kvAddRow: "+ Add field"
  kvKeyAria: "Key {index}"
  kvValueAria: "Value {index}"
  kvDeleteAria: "Delete row {index}"
  kvDuplicateKey: "Duplicate key (first row wins)"
  chipRemoveAria: "Remove {item}"
  # Field-level lock (field_metadata.asset_cards.locked, read-only banner)
  locked:
    banner: "Setting cards are locked (read-only)"
    unlock: "Unlock"
  # Placeholder note for fields not yet form-editable (object arrays etc.)
  fieldUnsupported: "Not editable in form yet"
  # In-card relationships read-only summary (CR P7: deferred with KR-010; graph view later)
  relationships:
    readonlyHint: "Relationships are read-only for now; a graph view will arrive once relation data matures"
  # Group labels (keys = deduped top-level keys of the 8 *FieldsSchema + 4 common + base)
