  zoom:
    group: "Canvas zoom"
    in: "Zoom in"
    out: "Zoom out"
    reset: "Reset zoom (100%)"
    fit: "Fit width"
    fitTitle: "Zoom until all columns are visible"
  # 08-26 structure rebuild batch 2 (R2): structure legend (completeness is an
  # acceptance line — every visual mark must be listed here).
  # Batch 5 (#43): collapsed to a one-line summary by default — expand/collapse
  # drive the toggle; summary is the collapsed quick view.
  legend:
    label: "Structure legend"
    expand: "Legend"
    collapse: "Collapse legend"
    summary: "Line colour · role glyph · selection ring · ✦ AI-added · validation badge · emotion bar · dashed displacement · steel-blue reorder · visibility · pacing strip — expand for all"
    lineHue: "Colour = story line"
    selectedRing: "Ring = selected"
    aiNew: "✦ = AI-added (brief pulse)"
    validation: "Corner badge = validation count"
    emotionBar: "Bottom bar = emotion (green + · amber ~ · red −)"
    displacement: "Dashed border = time displacement (line-level)"
    reorderOrdinal: "Steel-blue ordinal = reading-order jump (chapter workbench)"
    # Batch B (CR group 3b, R2 six-dimension matrix completion): visibility and
    # pacing-heat notation families join the legend.
    visibilityDim: "Transparency = hidden (line visibility toggle)"
    pacingHeat: "Top-edge strip = pacing heat (off by default)"
    spanWideCaption: "Wide card"
    spanWide: "= the scene spans chapters (arc-based writing units). Drag its card edge sideways; the +/- buttons are gone."
    stackOrderCaption: "Stacked chips"
    stackOrder: "= several scenes land in one chapter, ordered by reading sequence."
    emptySlotCaption: "Empty slot"
    emptySlot: "= the chapter exists but has no scenes yet; hover it to create one."
    paletteNote: "12-hue line palette cycles · beyond 12, lane position is primary"
    # Batch 8 (8.5, user-ratified): "two families of lines" guide — vertical arcs
    # (cross-view anchors) / in-zone edges (causal · suspense) / cross-line links.
    # T17 (08-27 user re-baseline): arcs render zero by default — hover or selection
    # is the only visibility gate.
    linkAnchorCaption: "Vertical arc"
    linkAnchor: "= cross-view anchor for the SAME scene (causal card ↔ workbench chip). Hidden by default — shown only while hovering either card of the scene, or when the scene is selected (misaligned scenes such as reorders get a steel-blue arc). A pending (unscheduled) endpoint draws none — not even on hover or selection."
    linkCausalCaption: "In-zone line"
    linkCausal: "= an edge between scenes — solid = CAUSAL · dashed = SUSPENSE (setup → payoff). Edges touching an unscheduled scene draw none."
    linkCrossLineCaption: "Line-to-line link"
    linkCrossLine: "= a cross-line reference — an event in one story line steering another."
  # 08-26 batch 2 (implement 2.4): lane scene count.
  lane:
    scenes: "{n} scenes"
    pendingCount: "{n} unscheduled scene(s)"
  # 08-26 structure rebuild batch 3 (prd R1): chapter planning workbench (merged
  # grid — rows=lines / cols=chapters / chips=scene slices in reading order;
  # supersedes the 1.10 "chapter weaving" panel, edit gestures fully migrated).
  workbench:
    title: "Chapter planning workbench"
    emptyNote: "No scenes yet"
    chapterColumn: "Chapter {n}"
    pendingColumn: "Unscheduled"
    pendingHint: "Scenes with no chapter assignment — attach a chapter (presentationSpans / episode / presentation-order chapter) to move them into chapter columns"
    # 08-27 findings batch 5 (T10/T11): the "continues into chapter N" marker retired
    # with T10 (the wide-card form itself carries the semantics — no verbal restatement);
    # three hover titles for always-rendered handles in their unusable states.
    handleRightAtEnd: "Right edge is already the last built chapter"
    handleLeftSingle: "A single-chapter card's left edge doesn't participate (first-chapter stability)"
    handleLeftAtFirst: "Left edge is already the first chapter"
  # Phase E3-interact (design §1.1 SceneDetailDrawer): author's drill-down + edit
  # form. Section headers + action labels only — data values render verbatim.
  # 08-27 structure-fixes round 3 (R12 / #73): one-line preamble per section
  # (*SectionHint) + beginner tooltips on the three zone badges + edge-type display
  # localization + human-readable episode membership; beat terminology rewritten for
  # authors (key names kept, values reworded — sole consumer is SceneEditPopover).
  drawer:
    title: "Scene detail"
    close: "Close"
    # R12 / #73: beginner tooltips for the three zone badges (what the zones are,
    # and when it is safe to write).
    mechBadgeTip: "Mechanical zone = hard structural coordinates (role / lines / time). Writes land immediately; the undo stack can roll them back."
    authorBadgeTip: "Author-sovereignty zone = your words here are the final fact. AI drafts only when you press the button."
    aiBadgeTip: "Each press sends ONE summary request to the agent (disabled while a run is active); AI never silently rewrites scene data."
    # R12 / #73: one-line preamble per section.
    stateSectionHint: "Role and story time are the scene's hard coordinates — changes write immediately and stay undoable."
    linesSectionHint: "Which story lines the scene belongs to — multi-line scenes appear in every line's row."
    enumsSectionHint: "The dropdown offers curated vocabulary as a prior — pick Custom… to enter any value."
    edgesSectionHint: "Incoming = causes pointing into this scene; outgoing = downstream effects it drives. Removing an edge never deletes the scene."
    semanticSectionHint: "The summary carries what the scene means — write it yourself, or draft via AI and finalize on your own terms."
    issuesSectionHint: "A read-only validation checklist (follows the toolbar Validation toggle)."
    actSectionHint: "Resolved from the phase references of the lines this scene joins — shown for context."
    beatSectionHint: "The owning chapter's emotion curve and pacing plan (authored by outline planning — read-only here)."
    retentionSectionHint: "A faithful snapshot of coordinates and foreign keys — retarget chapters via workbench drags or edge-resize, not here."
    # R12 / #73: edge-type display localization (stored values CAUSAL/SUSPENSE unchanged).
    edgeTypeCausal: "Causal"
    edgeTypeSuspense: "Suspense"
    # R12 / #73: human-readable episode membership (N = index + 1 human chapter
    # number, same convention as the workbench column headers; missing lookup falls
    # back to the raw id; numbered-but-untitled episodes use the untitled key).
    episodeValue: "Ch. {n} · {title}"
    episodeValueNoTitle: "Chapter {n} (untitled)"
    # dogfood R2 batch A (SP-2 drawer redo): two-zone form (mechanical·direct
